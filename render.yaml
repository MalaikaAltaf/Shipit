services:
  - type: web
    name: shipit-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # Set this manually as a secret in the Render dashboard
      - key: JWT_SECRET_KEY
        sync: false          # Set this manually as a secret in the Render dashboard
      - key: QSTASH_TOKEN
        sync: false          # Set this manually as a secret in the Render dashboard
      - key: QSTASH_CURRENT_SIGNING_KEY
        sync: false          # Set this manually as a secret in the Render dashboard
      - key: QSTASH_NEXT_SIGNING_KEY
        sync: false          # Set this manually as a secret in the Render dashboard
      - key: APP_BASE_URL
        sync: false          # Set to your Render URL e.g. https://shipit-api.onrender.com
